[project]
name = "fdq"
version = "0.1.0"
description = "Five Dollar Quant: simulation-first study of quant methods under extreme capital constraints"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ajaiupadhyaya" }]

dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "alpaca-py>=0.30",
    "yfinance>=0.2.40",
    "fredapi>=0.5",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "python-dateutil>=2.9",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "mypy>=1.9",
    "freezegun>=1.4",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
fdq = "fdq.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already ships everything under fdq/, templates included; a
# force-include of the same directory added each template twice and made the
# wheel unbuildable ("A second file is being added to the wheel archive").
packages = ["fdq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["tests/.*", "build/.*"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "fredapi.*", "alpaca.*", "matplotlib.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
